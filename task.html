
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        /* Task list */
        .task-list {
            max-width: 700px;
            margin: 20px auto;
        }

        /* Task card */
        .task-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .task-card h3 {
            margin-top: 0;
        }

        .task-card p {
            color: #555;
        }

        /* Buttons */
        button {
            padding: 8px 14px;
            margin-right: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .complete-btn {
            background-color: #4CAF50;
            color: white;
        }

        .edit-btn {
            background-color: #2196F3;
            color: white;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>

<body>

    <h1>My Task Manager</h1>

    <div class="task-list">

        <!-- Task 1 -->
        <div class="task-card">
            <h3>Complete HTML Assignment</h3>

            <p>
                Finish the HTML assignment before tomorrow.
            </p>

            <button class="complete-btn">
                Complete
            </button>

            <button class="edit-btn">
                Edit
            </button>

            <button class="delete-btn">
                Delete
            </button>
        </div>

        <!-- Task 2 -->
        <div class="task-card">
            <h3>Learn CSS Flexbox</h3>

            <p>
                Practice creating layouts using CSS Flexbox.
            </p>

            <button class="complete-btn">
                Complete
            </button>

            <button class="edit-btn">
                Edit
            </button>

            <button class="delete-btn">
                Delete
            </button>
        </div>

        <!-- Task 3 -->
        <div class="task-card">
            <h3>Practice JavaScript</h3>

            <p>
                Write some basic JavaScript programs.
            </p>

            <button class="complete-btn">
                Complete
            </button>

            <button class="edit-btn">
                Edit
            </button>

            <button class="delete-btn">
                Delete
            </button>
        </div>

    </div>

</body>
</html>
